name: Release

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Valid semver number syntax <x.x.x> (ex: 0.0.1)'
        required: true

permissions:
  contents: write
  pages: write
  id-token: write

run-name: Release v${{ github.event.inputs.strategy }}

jobs:
  release:
    runs-on: ubuntu-22.04
    if: ${{ github.actor == 'tduyng' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '^1.25'

      - name: Set up git-cliff
        uses: kenji-miyake/setup-git-cliff@v2

      - name: Run make tag
        env:
          VER: ${{ github.event.inputs.strategy }}
        run: make tag

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean --release-notes LATEST_CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    name: Build and Deploy Docs
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v${{ github.event.inputs.strategy }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build with VitePress
        run: bun run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy-docs:
    name: Deploy Docs to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: docs
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
