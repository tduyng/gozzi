name: Release

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: Valid semver number <x.x.x> or strategy <patch, minor, major>
        default: 'patch'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-22.04
    if: ${{ github.actor == 'tduyng' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Run make tag
        env:
          PART: ${{ github.event.inputs.strategy || 'patch' }}
        run: make tag

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean --release-notes CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
