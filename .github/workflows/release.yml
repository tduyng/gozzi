name: Release

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 'Valid semver number syntax <x.x.x> (ex: 0.0.1)'
        required: true
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pages: write
  id-token: write

run-name: Release v${{ github.event.inputs.strategy || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-22.04
    if: ${{ github.actor == 'tduyng' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '^1.25'

      - name: Set up git-cliff
        uses: kenji-miyake/setup-git-cliff@v2

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.strategy }}" >> $GITHUB_OUTPUT
          else
            # Extract version from tag (remove 'v' prefix)
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Update package.json and changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Updating package.json to version $VERSION..."
          sed -i 's/"version": "[^"]*"/"version": "'$VERSION'"/' package.json
          
          echo "Generating changelog..."
          git cliff --latest --prepend CHANGELOG.md
          git cliff --latest --strip all --output LATEST_CHANGELOG.md
          
          # Check if there are changes to commit
          if ! git diff --quiet package.json CHANGELOG.md LATEST_CHANGELOG.md; then
            git add CHANGELOG.md LATEST_CHANGELOG.md package.json
            git commit -m "chore: release v$VERSION"
            git push origin HEAD:main
          fi

      - name: Run just tag (for workflow_dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          just tag $VERSION
          # Push the release commit to main
          git push origin HEAD:main

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean --release-notes LATEST_CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-docs:
    name: Deploy Docs
    needs: release
    uses: ./.github/workflows/docs.yml
    permissions:
      contents: read
      pages: write
      id-token: write
