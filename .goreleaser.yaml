version: 2

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: gozzi
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

release:
  github:
    owner: tduyng
    name: gozzi
