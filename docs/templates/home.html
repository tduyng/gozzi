{{ template "partials/_head.html" . }}
    
    <div class="layout">
        {{ template "partials/_header.html" . }}
        
        <div class="layout-inner">
            {{ template "partials/_sidebar.html" . }}
            
            <main class="content">
                <div class="home-hero">
                    <h1 class="hero-title">{{ .Site.Config.extra.name }}</h1>
                    <p class="hero-tagline">{{ .Site.Config.extra.tagline }}</p>
                    <div class="hero-actions">
                        <a href="{{ .Site.Config.base_url }}/getting-started" class="btn btn-primary">Get Started</a>
                        <a href="{{ .Site.Config.extra.repo_url }}" class="btn btn-secondary" target="_blank">View on GitHub</a>
                    </div>
                </div>
                
                <article class="prose">
                    {{ .Page.Content }}
                </article>
                
                {{ template "partials/_footer.html" . }}
            </main>
        </div>
    </div>

    <script src="{{ .Site.Config.base_url }}/js/main.js"></script>
    
    <!-- KaTeX auto-render -->
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous" onload="renderKaTeX()"></script>
    <script>
        function renderKaTeX() {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '\\(', right: '\\)', display: false},
                    {left: '\\[', right: '\\]', display: true}
                ],
                throwOnError: false
            });
        }
    </script>
    
    <!-- Mermaid diagrams -->
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ 
            startOnLoad: true,
            theme: 'default'
        });
    </script>
</body>
</html>
