<header class="header" role="banner">
    <div class="header-inner">
        <div class="header-left">
            <a href="{{ .Site.Config.extra.base_path }}/" class="logo">
                <img src="{{ .Site.Config.extra.base_path }}/images/logo.svg" alt="Gozzi Logo" class="logo-icon">
                <span class="logo-text">{{ .Site.Config.extra.name }}</span>
            </a>
        </div>
        <div class="header-right">
            <a href="{{ .Site.Config.extra.repo_url }}" class="github-link" target="_blank" rel="noopener" aria-label="View on GitHub">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
                </svg>
                <span>GitHub</span>
            </a>
            <button class="search-button" id="search-btn" aria-label="Search documentation">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                <span>Search</span>
                <span class="search-kbd" aria-hidden="true">⌘K</span>
            </button>
            <button class="menu-toggle" id="menu-toggle" aria-label="Open navigation menu" aria-expanded="false" aria-controls="sidebar-drawer">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>
        </div>
    </div>
</header>

<!-- Mobile sidebar drawer -->
<div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>
<aside class="sidebar-drawer" id="sidebar-drawer" role="navigation" aria-label="Main navigation" aria-hidden="true">
    <div class="sidebar-drawer-header">
        <span class="sidebar-drawer-title">Navigation</span>
        <button class="close-drawer" id="close-drawer" aria-label="Close navigation menu">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M18 6 6 18"></path>
                <path d="m6 6 12 12"></path>
            </svg>
        </button>
    </div>
    {{ range $.Site.Config.extra.sidebar }}
    <div class="sidebar-section">
        <h3 class="sidebar-title">{{ .title }}</h3>
        <ul class="sidebar-items">
            {{ range .items }}
            <li>
                <a href="{{ $.Site.Config.extra.base_path }}{{ .link }}" class="sidebar-link">{{ .text }}</a>
            </li>
            {{ end }}
        </ul>
    </div>
    {{ end }}
</aside>
