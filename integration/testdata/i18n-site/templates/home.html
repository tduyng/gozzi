<!DOCTYPE html>
<html lang="{{ .Page.Config.lang }}">
<head>
    <title>{{ .Page.Config.title }}</title>
</head>
<body>
    <h1>{{ i18n "tagline" .Page.Config }}</h1>
    
    {{ if .Site.Config.i18n_enabled }}
    <nav class="language-switcher">
        {{ range .Site.Config.languages }}
        <a href="{{ langURL .code $.Page }}">{{ .name }}</a>
        {{ end }}
    </nav>
    {{ end }}
    
    <main>
        {{ .Page.Content }}
    </main>
    
    <footer>
        <p>{{ i18n "greeting.welcome" .Page.Config }} | Language: {{ .Page.Config.lang }}</p>
    </footer>
</body>
</html>
